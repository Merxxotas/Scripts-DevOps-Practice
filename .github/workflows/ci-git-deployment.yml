name: Git Deployment CI/CD

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
    paths:
      - '9-Automated-Git-Deployment/**'
      - '.github/workflows/ci-git-deployment.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '9-Automated-Git-Deployment/**'
      - '.github/workflows/ci-git-deployment.yml'

jobs:
  lint-bash:
    name: Lint Bash (ShellCheck)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck -x "9-Automated-Git-Deployment/git_deploy.sh"
          shellcheck -x "9-Automated-Git-Deployment/tests/test_git_deploy.sh"

  test-bash:
    name: Test Bash on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Make scripts executable
        run: |
          chmod +x "9-Automated-Git-Deployment/git_deploy.sh"
          chmod +x "9-Automated-Git-Deployment/tests/test_git_deploy.sh"
      - name: Run Bash Test Suite
        run: |
          ./9-Automated-Git-Deployment/tests/test_git_deploy.sh

  lint-powershell:
    name: Lint PowerShell (PSScriptAnalyzer)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
              break
            } catch {
              if ($attempts -ge 3) { throw }
              Start-Sleep -Seconds 10
            }
          }
          (Get-Module -ListAvailable PSScriptAnalyzer).Version
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer -Path "9-Automated-Git-Deployment/git_deploy.ps1" -Settings "9-Automated-Git-Deployment/PSScriptAnalyzerSettings.psd1"
          Invoke-ScriptAnalyzer -Path "9-Automated-Git-Deployment/tests/test_git_deploy.ps1" -Settings "9-Automated-Git-Deployment/PSScriptAnalyzerSettings.psd1"

  test-powershell:
    name: Test PowerShell on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run PowerShell Test Suite
        shell: pwsh
        run: |
          & './9-Automated-Git-Deployment/tests/test_git_deploy.ps1'