name: EventOps CI/CD

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
    paths:
      - '11-Scheduling-And-Automation/**'
      - '.github/workflows/ci-eventops.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '11-Scheduling-And-Automation/**'
      - '.github/workflows/ci-eventops.yml'

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv and install dependencies
        run: |
          cd 11-Scheduling-And-Automation/EventOps
          uv venv .venv
          uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python Ruff Linting
        run: |
          cd 11-Scheduling-And-Automation/EventOps
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Python Pytest Suite
        run: |
          cd 11-Scheduling-And-Automation/EventOps
          uv run pytest

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Vet & Format Check
        run: |
          cd 11-Scheduling-And-Automation/EventOps-Go
          go vet ./...

      - name: Run Go Test Suite
        run: |
          cd 11-Scheduling-And-Automation/EventOps-Go
          go test -v ./...
