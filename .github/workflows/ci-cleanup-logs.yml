name: Log Cleanup CI/CD

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
    paths:
      - '2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/**'
      - '.github/workflows/ci-cleanup-logs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/**'
      - '.github/workflows/ci-cleanup-logs.yml'

permissions:
  contents: read

jobs:
  lint-bash:
    name: Lint Bash (ShellCheck)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: |
          shellcheck -x "2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/cleanup_logs.sh"
          shellcheck -x "2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/tests/test_cleanup_logs.sh"

  test-bash:
    name: Test Bash on ${{ matrix.os }}
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make scripts executable
        run: |
          chmod +x "2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/cleanup_logs.sh"
          chmod +x "2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/tests/test_cleanup_logs.sh"

      - name: Run Bash Test Suite
        run: |
          ./2-Log-Cleanup-Script-\(Delete-Files-Older-Than-X-Days\)/tests/test_cleanup_logs.sh

  lint-powershell:
    name: Lint PowerShell (PSScriptAnalyzer)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
              break
            } catch {
              if ($attempts -ge 3) { throw }
              Start-Sleep -Seconds 10
            }
          }
          (Get-Module -ListAvailable PSScriptAnalyzer).Version

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @()
          $results += @(Invoke-ScriptAnalyzer -Path "2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/cleanup_logs.ps1" -Settings "2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/PSScriptAnalyzerSettings.psd1")
          $results += @(Invoke-ScriptAnalyzer -Path "2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/tests/test_cleanup_logs.ps1" -Settings "2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/PSScriptAnalyzerSettings.psd1")
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
          }
          Write-Host "PSScriptAnalyzer found no issues"

  test-powershell:
    name: Test PowerShell on ${{ matrix.os }}
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run PowerShell Test Suite
        shell: pwsh
        run: |
          & './2-Log-Cleanup-Script-(Delete-Files-Older-Than-X-Days)/tests/test_cleanup_logs.ps1'
