name: Database Backup CI/CD

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
    paths:
      - '3-Automated-Database-Backup-with-Timestamp/**'
      - '.github/workflows/ci-database-backup.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '3-Automated-Database-Backup-with-Timestamp/**'
      - '.github/workflows/ci-database-backup.yml'

permissions:
  contents: read

jobs:
  lint-bash:
    name: Lint Bash (ShellCheck)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: |
          shellcheck -x "3-Automated-Database-Backup-with-Timestamp/db_backup.sh"
          shellcheck -x "3-Automated-Database-Backup-with-Timestamp/tests/test_db_backup.sh"

  test-bash:
    name: Test Bash on ${{ matrix.os }}
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make scripts executable
        run: |
          chmod +x "3-Automated-Database-Backup-with-Timestamp/db_backup.sh"
          chmod +x "3-Automated-Database-Backup-with-Timestamp/tests/test_db_backup.sh"

      - name: Run Bash Test Suite
        run: |
          ./3-Automated-Database-Backup-with-Timestamp/tests/test_db_backup.sh

  lint-powershell:
    name: Lint PowerShell (PSScriptAnalyzer)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
              break
            } catch {
              if ($attempts -ge 3) { throw }
              Start-Sleep -Seconds 10
            }
          }
          (Get-Module -ListAvailable PSScriptAnalyzer).Version

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @()
          $results += @(Invoke-ScriptAnalyzer -Path "3-Automated-Database-Backup-with-Timestamp/db_backup.ps1" -Settings "3-Automated-Database-Backup-with-Timestamp/PSScriptAnalyzerSettings.psd1")
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
          }
          Write-Host "PSScriptAnalyzer found no issues"

  test-powershell:
    name: Test PowerShell on ${{ matrix.os }}
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run PowerShell Test Suite
        shell: pwsh
        run: |
          & './3-Automated-Database-Backup-with-Timestamp/tests/test_db_backup.ps1'